[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ideo-literature-digest"
version = "0.1.0"
description = "A weekly academic literature digest for the VCL IDEO Phase 1 experiment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0.0,<4",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
]

[project.scripts]
ideo-digest = "ideo_digest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

