name: Weekly IDEO literature digest

on:
  schedule:
    - cron: "0 9 * * 5"
      timezone: "America/Vancouver"
  workflow_dispatch:
    inputs:
      include_seen:
        description: "Include already-sent papers for testing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: weekly-ideo-literature-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_TO: ${{ secrets.EMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest

      - name: Generate and email digest
        run: |
          if [ "${{ github.event.inputs.include_seen }}" = "true" ]; then
            ideo-digest --include-seen
          else
            ideo-digest
          fi

      - name: Save sent-paper history
        run: |
          if git diff --quiet -- data/seen.json; then
            echo "No seen-paper state change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git commit -m "chore: update sent-paper history"
          git push

